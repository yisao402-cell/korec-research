<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新入社員モニタリング ダッシュボード｜株式会社ボイス</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0e1417; --panel:#151d22; --panel2:#1b262d; --line:#28353e;
    --txt:#e9eef2; --sub:#9db0bb; --muted:#6c7f8a;
    --accent:#35c4a5; --good:#3ddc97; --warn:#ffb454; --bad:#ff6b81;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--txt);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px; margin:0 auto; padding:28px 20px 80px}
  header.top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:24px}
  h1{font-size:23px; margin:0 0 4px; letter-spacing:.02em}
  .sub{color:var(--sub); font-size:13px}
  .meta{color:var(--muted); font-size:12px; text-align:right}
  .badge{display:inline-block; background:var(--panel2); border:1px solid var(--line); color:var(--sub); border-radius:999px; padding:3px 10px; font-size:11px; margin-left:6px}

  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px}
  .kpi .label{color:var(--sub); font-size:12px; margin-bottom:6px}
  .kpi .val{font-size:30px; font-weight:700; line-height:1.1}
  .kpi .val small{font-size:14px; color:var(--muted); font-weight:500}
  .kpi .delta{font-size:12px; margin-top:4px}
  .up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
  .kpi.alert .val{color:var(--warn)}

  section{margin-bottom:30px}
  .sec-h{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 14px}
  .sec-h h2{font-size:17px; margin:0; font-weight:700}
  .sec-h .hint{color:var(--muted); font-size:12px}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .chart-box{position:relative; height:300px}

  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px; display:flex; flex-direction:column; gap:10px}
  .card.flagged{border-color:#4a3a1c}
  .card .name{font-size:15px; font-weight:700; display:flex; justify-content:space-between; align-items:center}
  .card .name .miss{font-size:10px; color:var(--warn); font-weight:600}
  .scorerow{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .score{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:7px 4px; text-align:center}
  .score.low{border-color:var(--warn)}
  .score .t{font-size:10px; color:var(--sub)}
  .score .n{font-size:18px; font-weight:700}
  .score .n small{font-size:10px; color:var(--muted); font-weight:500}
  .spark{height:90px; position:relative}
  .latest{font-size:11.5px; color:var(--sub); border-top:1px dashed var(--line); padding-top:7px}
  .latest b{color:var(--txt); font-weight:600}

  .alerts{display:flex; flex-direction:column; gap:10px}
  .alert-item{display:flex; gap:12px; align-items:flex-start; background:#241f1a; border:1px solid #4a3a1c; border-radius:12px; padding:12px 14px}
  .alert-item.critical{background:#2b1a1e; border-color:#5a2733}
  .alert-item .ico{font-size:18px}
  .alert-item .who{font-weight:700}
  .alert-item .msg{font-size:13px; color:var(--sub)}
  .alert-item.ok{background:#15291f; border-color:#1f4733}
  .alert-item.ok .ico{color:var(--good)}

  .timeline{display:grid; grid-template-columns:1fr; gap:16px}
  .tl-col h3{font-size:13px; color:var(--sub); margin:0 0 10px; font-weight:700}
  .tl-list{display:flex; flex-direction:column; gap:10px; max-height:560px; overflow:auto; padding-right:6px}
  .tl-item{background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:10px; padding:10px 12px}
  .tl-item.concern{border-left-color:var(--warn); background:#241f1a}
  .tl-item.consult{border-left-color:var(--bad); background:#2b1a1e}
  .tl-item .tl-top{display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted); margin-bottom:4px}
  .tl-item .who{color:var(--txt); font-weight:600}
  .tl-item .sc{font-variant-numeric:tabular-nums}
  .tl-item .body{font-size:13px; color:var(--txt); white-space:pre-wrap; word-break:break-word}
  .flagtag{display:inline-block; background:#3a2c12; color:var(--warn); border-radius:6px; padding:1px 7px; font-size:10px; margin-right:6px}
  .flagtag.red{background:#3a1220; color:var(--bad)}

  .subtable{width:100%; border-collapse:collapse; font-size:12px}
  .subtable th,.subtable td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:center}
  .subtable th{color:var(--sub); font-weight:600}
  .subtable td:first-child,.subtable th:first-child{text-align:left}
  .dot-ok{color:var(--good)} .dot-ng{color:var(--muted)}

  .legend{display:flex; gap:14px; font-size:12px; color:var(--sub); margin-bottom:8px; flex-wrap:wrap}
  .legend .k{display:inline-flex; align-items:center; gap:6px}
  .dot{width:10px; height:10px; border-radius:3px; display:inline-block}

  footer{color:var(--muted); font-size:12px; text-align:center; margin-top:40px; border-top:1px solid var(--line); padding-top:20px}
  .scale-note{color:var(--muted); font-size:11px}

  @media(max-width:1080px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
    .cards{grid-template-columns:repeat(2,1fr)}
    .timeline{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <h1>新入社員モニタリング ダッシュボード</h1>
    <div class="sub">株式会社ボイス｜週次セルフレポート（モチベーション・成長実感・コンディション）<span class="badge">本人申告</span></div>
  </div>
  <div class="meta">最終更新: <span id="meta-updated"></span><br><span class="scale-note">スコアは1〜5（5が最良）／週は提出日の属する週（月曜起点）</span></div>
</header>

<section>
  <div class="kpis" id="kpis"></div>
</section>

<section>
  <div class="sec-h"><h2>⚠️ フォローが必要なメンバー</h2><div class="hint">相談あり・低スコア・急落・未提出を自動検知</div></div>
  <div class="alerts" id="alerts"></div>
</section>

<section>
  <div class="sec-h"><h2>全体推移</h2><div class="hint">週ごとの全員平均</div></div>
  <div class="grid2">
    <div class="panel">
      <div class="legend" id="legend-metrics"></div>
      <div class="chart-box"><canvas id="chart-overall"></canvas></div>
    </div>
    <div class="panel">
      <div class="legend" id="legend-members"></div>
      <div class="chart-box"><canvas id="chart-members"></canvas></div>
    </div>
  </div>
</section>

<section>
  <div class="sec-h"><h2>メンバー別サマリー</h2><div class="hint">最新週スコア／モチベーション推移／直近コメント</div></div>
  <div class="cards" id="cards"></div>
</section>

<section>
  <div class="sec-h"><h2>提出状況</h2><div class="hint">●=提出済み</div></div>
  <div class="panel" style="overflow-x:auto"><table class="subtable" id="subtable"></table></div>
</section>

<section>
  <div class="sec-h"><h2>1週間の振り返り</h2><div class="hint">新しい順／⚠=不安ワード・低スコア、🔴=相談あり</div></div>
  <div class="timeline">
    <div class="tl-col"><div class="tl-list" id="tl-notes" style="max-height:none"></div></div>
  </div>
</section>

<footer>株式会社ボイス 新入社員モニタリング｜経営陣・育成担当 閲覧用</footer>
</div>

<script>
/*__DATA_START__*/
const MEMBERS = ["中山", "中川", "鈴木", "田中", "横山"];
const ROWS = [{"d": "2026/8/6", "m": "鈴木", "mot": 4, "gro": 4, "cond": 2, "note": "今週は休みをいただいておりましたのであまり業務をできておりませんが、今の作業はとても楽しいです。", "consult": ""}, {"d": "2026/8/6", "m": "中山", "mot": 5, "gro": 5, "cond": 5, "note": "まだまだ力不足を感じるので、出来るだけ自分が成長できるように頑張っていこうと考えている。", "consult": ""}, {"d": "2026/8/6", "m": "田中", "mot": 4, "gro": 4, "cond": 4, "note": "1ヶ月経ったのにまだ慣れないことが多すぎる。早く慣れたい。", "consult": ""}, {"d": "2026/8/6", "m": "横山", "mot": 4, "gro": 3, "cond": 4, "note": "先週からは、現在OJTの課題で取り組んでいる、オセロ制作のクラス図を考え、現在はログイン機能の実装と、SQL文、DBからデータを取ってくる方法は、自動的か手動的かの2つのやり方があることを学びました。 クラス図の作成を通して、それぞれのクラスの役割や関係性などについて、理解を深めることができました。 ですが、各クラスに必要な処理が理解できても、その処理をどのようにコードとして書いていくのかが分からない状態なので、参考コードとして用意されている内容を調べながら、進めています。 自宅では買った入門書を読みながら、実際にコードなどを書きながら、基礎から学んでいるので、連休中に小さいアプリを作成して、各処理の書き方や流れについて、理解を深めて行きたいと思います。", "consult": ""}, {"d": "2026/8/13", "m": "中川", "mot": 3, "gro": 2, "cond": 3, "note": "まあまあ。悪くないが良いとも言えません。", "consult": ""}, {"d": "2026/8/13", "m": "田中", "mot": 4, "gro": 4, "cond": 4, "note": "バグ対応にたくさんAIを使用して便利さを感じた。", "consult": ""}, {"d": "2026/8/13", "m": "横山", "mot": 4, "gro": 4, "cond": 4, "note": "今週は、連休中に購入した入門書を読みながら、実際にコードを書いたり、問題を解いたりして学習を進めました。 また、先週に比べて、書かれているコードがどのような流れで処理されているのかを理解できるようになってきました。 一方で、コードを読んでどんな処理をしているのかをイメージできても、それを実際に自分でコードとして書く際に、どのように記述すればよいのか思い浮かばないので、引き続き実際にコードを書くことを繰り返し、覚えていきたいと思います。 また、普通の書き方を理解する前に、OJTで取り組んでいるオセロ作成ではラムダ式を使用しているため、苦戦していますが、理解できたら便利になるので、理解できるように頑張っていきます。", "consult": ""}, {"d": "2026/8/14", "m": "中山", "mot": 5, "gro": 3, "cond": 5, "note": "お盆や、有給奨励日等もあり、今週はあまり出勤が出来なかったので成長実感は少ない。 来週からまた切り替えて仕事に取り組めれば良いと思う。", "consult": ""}, {"d": "2026/8/17", "m": "鈴木", "mot": 4, "gro": 3, "cond": 3, "note": "今週は仕事量が少なく、着実に向き合うことができた", "consult": ""}, {"d": "2026/8/20", "m": "田中", "mot": 4, "gro": 4, "cond": 4, "note": "1週間かけて実装したけど流石に遅すぎたかもしれない", "consult": ""}, {"d": "2026/8/20", "m": "中川", "mot": 2, "gro": 3, "cond": 4, "note": "揺るぎない。最近の人生には浮き沈みが絶えなかった。しかも、私は粘り強く歩み続ける", "consult": ""}, {"d": "2026/8/20", "m": "鈴木", "mot": 3, "gro": 3, "cond": 2, "note": "今週は不調期間が長いので集中しづらかったです", "consult": ""}, {"d": "2026/8/20", "m": "中山", "mot": 4, "gro": 5, "cond": 4, "note": "単純作業が多く、なかなか成長実感みたいな部分だと難しかった。しかし、こういった確認作業は、自分的には苦手な反面どこの現場でも避けては通れないものだと思うので今のうちに慣れていきたいと考えている。", "consult": ""}, {"d": "2026/8/20", "m": "横山", "mot": 4, "gro": 4, "cond": 4, "note": "今週はOJTの課題に取り組んでいる中で、クラスの関係性の理解度が足りないなと感じ、自宅学習の間に実際にAIに、クラスを作ってif文やfor文、配列などを使って解く問題を出してもらいながら、利害度を深めるために学習を進めて行きました。 コードを読むことや、フロントを受け取った値をもとに、DBの方から一致するものを取ってきて返す流れは、始めの頃よりも少しずつですが、スムーズにできるようになってきています。 ですが、まだDBから必要なカラムが何かや、処理の流れをイメージするのに苦戦する部分もあるので、引き続き自宅学習を通しながら、学んでいこうと思います。 また、初めて行う機能の実装になると、詰まってしまうので、一旦どういう処理が必要なのかを、言語化していきながら、一つひとつコードの方に落としこんでいけたらなと思いました。 まだロジカル的に考えられていない部分や、逆に難しく考えすぎてしまっている部分もあるので、考え方の知識も身に付けていこうと思います。 少しずつ知識が増えていくことで、考える際に余裕ができてきて、今までは気づかなかった部分や、疑問を持てるようになってきたので、一つひとつ疑問に思った部分を解決しながら、成長していけるように頑張っていきます。", "consult": ""}];
const META_UPDATED = "2026/08/24 11:44（回答14件）";
/*__DATA_END__*/

const METRICS = [
  {key:'mot',  label:'モチベーション', short:'モチベ', color:'#35c4a5'},
  {key:'gro',  label:'成長実感',       short:'成長',   color:'#c792ea'},
  {key:'cond', label:'コンディション', short:'体調',   color:'#ffb454'},
];
const MCOLOR = ['#35c4a5','#6c8cff','#c792ea','#ffb454','#ff6b81','#3ddc97','#f78c6c','#82aaff'];

document.getElementById('meta-updated').textContent = META_UPDATED;

/* ---- 週バケット（提出日→その週の月曜）
   金曜案内〜週末提出のサイクルのため、月曜・火曜の提出は前週分の遅れ提出として前週に割り当てる ---- */
function weekInfo(dStr){
  const [y,mo,da] = dStr.split('/').map(Number);
  const dt = new Date(y, mo-1, da);
  dt.setDate(dt.getDate()-2);
  const off = (dt.getDay()+6)%7;
  dt.setDate(dt.getDate()-off);
  return {label:`${dt.getMonth()+1}/${dt.getDate()}週`, ts:dt.getTime()};
}
ROWS.forEach(r=>{ const w=weekInfo(r.d); r._w=w.label; r._ts=w.ts; });
const WEEKS = (()=>{ const m=new Map(); ROWS.forEach(r=>m.set(r._w,r._ts)); return [...m.entries()].sort((a,b)=>a[1]-b[1]).map(e=>e[0]); })();

const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const rnd = v => v==null?null:+v.toFixed(2);
const seriesFor = (member,key) => WEEKS.map(w=>{ const v=ROWS.filter(r=>r.m===member&&r._w===w).map(r=>r[key]); return v.length?rnd(avg(v)):null; });
const weeklyOverall = key => WEEKS.map(w=>{ const v=ROWS.filter(r=>r._w===w).map(r=>r[key]); return v.length?rnd(avg(v)):null; });
const lastTwo = arr => { const idx=[]; for(let i=arr.length-1;i>=0;i--){ if(arr[i]!=null){ idx.push(i); if(idx.length===2) break; } } return idx; };

/* ---- 不安ワード検知 ---- */
const FLAG_WORDS = ["体調不良","不安","心配","疲れ","しんどい","つらい","辛い","遅れ","間に合わ","ミス","落ち込","眠れ","キツ","きつい","孤独","辞め","自信がな"];
const isConcernText = t => t && FLAG_WORDS.some(w=>t.includes(w));
const lowScore = r => ['mot','gro','cond'].some(k=>r[k]!=null && r[k]<=2);
const NO_CONSULT = /^(特に|今は)?(なし|無し|ない(です)?|無い(です)?|ありません|ありませんです|大丈夫(です)?|問題(ない(です)?|ありません)|OK|ok)[。．.!！\s]*$/;
const hasConsult = r => { const t=(r.consult||'').trim(); return !!t && !NO_CONSULT.test(t); };

/* ---- KPI ---- */
(function(){
  const box = document.getElementById('kpis');
  const lastW = WEEKS[WEEKS.length-1];
  const submitted = new Set(ROWS.filter(r=>r._w===lastW).map(r=>r.m));
  const html = [];
  METRICS.forEach(mt=>{
    const s = weeklyOverall(mt.key);
    const [li,pi] = lastTwo(s);
    const cur = li!=null?s[li]:null, prv = pi!=null?s[pi]:null;
    let delta = '<span class="flat">—</span>';
    if(cur!=null && prv!=null){
      const d = +(cur-prv).toFixed(2);
      const cls = d>0.001?'up':(d<-0.001?'down':'flat');
      const a = d>0.001?'▲':(d<-0.001?'▼':'→');
      delta = `<span class="${cls}">${a} ${Math.abs(d).toFixed(2)} <small style="color:var(--muted)">前週比</small></span>`;
    }
    html.push(`<div class="kpi${cur!=null&&cur<3?' alert':''}">
      <div class="label">${mt.label}（今週平均）</div>
      <div class="val">${cur!=null?cur.toFixed(2):'–'}<small> /5</small></div>
      <div class="delta">${delta}</div></div>`);
  });
  html.push(`<div class="kpi${submitted.size<MEMBERS.length?' alert':''}">
    <div class="label">今週の提出（${lastW}）</div>
    <div class="val">${submitted.size}<small> /${MEMBERS.length}名</small></div>
    <div class="delta"><span class="${submitted.size===MEMBERS.length?'up':'down'}">${submitted.size===MEMBERS.length?'全員提出済み':'未提出: '+MEMBERS.filter(m=>!submitted.has(m)).join('、')}</span></div></div>`);
  box.innerHTML = html.join('');
})();

/* ---- アラート ---- */
(function(){
  const box = document.getElementById('alerts');
  const items = [];
  const lastW = WEEKS[WEEKS.length-1];
  MEMBERS.forEach(m=>{
    const rows = ROWS.filter(r=>r.m===m).sort((a,b)=>a._ts-b._ts);
    const latest = rows[rows.length-1];
    // 相談あり（最新提出分）
    if(latest && hasConsult(latest)){
      items.push({cls:'critical', ico:'🔴', who:m, msg:`相談したいことの記入あり（${latest._w}）: 「${latest.consult}」`});
    }
    // 低スコア
    if(latest && lowScore(latest)){
      const low = METRICS.filter(mt=>latest[mt.key]!=null && latest[mt.key]<=2).map(mt=>`${mt.label} ${latest[mt.key]}`).join(' / ');
      items.push({cls:'', ico:'🟠', who:m, msg:`スコア2以下: ${low}（${latest._w}）`});
    }
    // モチベ急落（-1.5以上、または-1.0以上かつ最新が3以下）
    const s = seriesFor(m,'mot');
    const [li,pi] = lastTwo(s);
    if(li!=null && pi!=null){
      const drop = s[pi]-s[li];
      if(drop>=1.5 || (drop>=1.0 && s[li]<=3)){
        items.push({cls:'', ico:'🟠', who:m, msg:`モチベーションが前回比 -${drop.toFixed(1)}（${s[pi]} → ${s[li]}）`});
      }
    }
    // 連続未提出
    let missStreak = 0;
    for(let i=WEEKS.length-1;i>=0;i--){ if(rows.some(r=>r._w===WEEKS[i])) break; missStreak++; }
    if(missStreak>=2) items.push({cls:'', ico:'🟠', who:m, msg:`${missStreak}週連続で未提出（最終提出: ${latest?latest._w:'なし'}）`});
    else if(missStreak===1) items.push({cls:'', ico:'⚪', pr:2, who:m, msg:`今週（${lastW}）未提出。金曜案内直後なら様子見でOK`});
  });
  if(!items.length){
    box.innerHTML = `<div class="alert-item ok"><div class="ico">✅</div><div><span class="who">全員問題なし</span><div class="msg">低スコア・急落・未提出・相談事項はありません</div></div></div>`;
  } else {
    const prio = i => i.pr ?? (i.cls==='critical'?0:1);
    items.sort((a,b)=>prio(a)-prio(b));
    box.innerHTML = items.map(i=>`<div class="alert-item ${i.cls}"><div class="ico">${i.ico}</div><div><span class="who">${i.who}</span><div class="msg">${i.msg}</div></div></div>`).join('');
  }
})();

/* ---- チャート共通 ---- */
Chart.defaults.color = '#9db0bb';
Chart.defaults.borderColor = '#28353e';
const lineOpts = {responsive:true, maintainAspectRatio:false,
  scales:{y:{min:1,max:5,ticks:{stepSize:1}}},
  plugins:{legend:{display:false}}, spanGaps:true,
  elements:{line:{tension:.3}, point:{radius:3}}};

/* 全体推移（指標別） */
(function(){
  const lg = document.getElementById('legend-metrics');
  lg.innerHTML = METRICS.map(mt=>`<span class="k"><span class="dot" style="background:${mt.color}"></span>${mt.label}</span>`).join('');
  new Chart(document.getElementById('chart-overall'),{type:'line',
    data:{labels:WEEKS, datasets:METRICS.map(mt=>({label:mt.label, data:weeklyOverall(mt.key), borderColor:mt.color, backgroundColor:mt.color}))},
    options:lineOpts});
})();

/* メンバー別モチベ推移 */
(function(){
  const lg = document.getElementById('legend-members');
  lg.innerHTML = MEMBERS.map((m,i)=>`<span class="k"><span class="dot" style="background:${MCOLOR[i%MCOLOR.length]}"></span>${m}</span>`).join('') + '<span class="k" style="color:var(--muted)">（モチベーション）</span>';
  new Chart(document.getElementById('chart-members'),{type:'line',
    data:{labels:WEEKS, datasets:MEMBERS.map((m,i)=>({label:m, data:seriesFor(m,'mot'), borderColor:MCOLOR[i%MCOLOR.length], backgroundColor:MCOLOR[i%MCOLOR.length]}))},
    options:lineOpts});
})();

/* ---- メンバーカード ---- */
(function(){
  const box = document.getElementById('cards');
  const lastW = WEEKS[WEEKS.length-1];
  box.innerHTML = MEMBERS.map((m,i)=>{
    const rows = ROWS.filter(r=>r.m===m).sort((a,b)=>a._ts-b._ts);
    const latest = rows[rows.length-1];
    const missing = latest ? latest._w!==lastW : true;
    const flagged = latest && (lowScore(latest) || isConcernText(latest.note) || hasConsult(latest));
    const scores = METRICS.map(mt=>{
      const v = latest?latest[mt.key]:null;
      return `<div class="score${v!=null&&v<=2?' low':''}"><div class="t">${mt.short}</div><div class="n">${v??'–'}<small>/5</small></div></div>`;
    }).join('');
    const cmt = latest && latest.note ? `<div class="latest"><b>${latest._w}:</b> ${latest.note.slice(0,60)}${latest.note.length>60?'…':''}</div>` : '';
    return `<div class="card${flagged?' flagged':''}">
      <div class="name">${m}${missing?'<span class="miss">今週未提出</span>':''}</div>
      <div class="scorerow">${scores}</div>
      <div class="spark"><canvas id="spark-${i}"></canvas></div>
      ${cmt}</div>`;
  }).join('');
  MEMBERS.forEach((m,i)=>{
    new Chart(document.getElementById('spark-'+i),{type:'line',
      data:{labels:WEEKS, datasets:[{data:seriesFor(m,'mot'), borderColor:MCOLOR[i%MCOLOR.length], backgroundColor:MCOLOR[i%MCOLOR.length]}]},
      options:{...lineOpts, scales:{y:{min:1,max:5,display:false},x:{display:false}}, elements:{line:{tension:.3},point:{radius:2}}}});
  });
})();

/* ---- 提出状況テーブル ---- */
(function(){
  const t = document.getElementById('subtable');
  let html = '<tr><th>メンバー</th>' + WEEKS.map(w=>`<th>${w}</th>`).join('') + '</tr>';
  MEMBERS.forEach(m=>{
    html += `<tr><td>${m}</td>` + WEEKS.map(w=>{
      const has = ROWS.some(r=>r.m===m&&r._w===w);
      return `<td class="${has?'dot-ok':'dot-ng'}">${has?'●':'－'}</td>`;
    }).join('') + '</tr>';
  });
  t.innerHTML = html;
})();

/* ---- 振り返りタイムライン ---- */
(function(){
  const sorted = [...ROWS].sort((a,b)=>b._ts-a._ts);
  const box = document.getElementById('tl-notes');
  const scoreStr = r => METRICS.map(mt=>`${mt.short}${r[mt.key]??'–'}`).join('・');
  box.innerHTML = sorted.filter(r=>(r.note&&r.note.trim())||hasConsult(r)).map(r=>{
    const consult = hasConsult(r) ? r.consult.trim() : '';
    const concern = lowScore(r) || isConcernText(r.note);
    const cls = consult?'consult':(concern?'concern':'');
    const tags = (consult?'<span class="flagtag red">🔴 相談あり</span>':'') + (concern?'<span class="flagtag">⚠ 要チェック</span>':'');
    const body = [r.note&&r.note.trim()?r.note:null, consult?`【相談】${r.consult}`:null].filter(Boolean).join('\n');
    return `<div class="tl-item ${cls}"><div class="tl-top"><span><span class="who">${r.m}</span>｜${r._w}</span><span class="sc">${scoreStr(r)}</span></div><div class="body">${tags}${body}</div></div>`;
  }).join('') || '<div class="tl-item"><div class="body">記入なし</div></div>';
})();
</script>
</body>
</html>
